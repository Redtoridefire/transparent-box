<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transparent Overlay Box</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="floating-box" id="floatingBox" aria-label="Floating prompt box">
      <div class="floating-box__header" id="dragHandle">
        <span>Overlay</span>
        <span class="floating-box__badge">Drag</span>
      </div>
      <textarea
        class="floating-box__textarea"
        placeholder="Type directly into the overlay..."
      ></textarea>
      <div class="floating-box__footer">
        <span class="floating-box__status">Ready</span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
